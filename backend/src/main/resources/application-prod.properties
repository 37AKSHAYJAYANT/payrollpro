# ==============================================================================
# Production profile overrides (activated via SPRING_PROFILES_ACTIVE=prod).
# Only security-relevant hardening lives here; everything else is inherited
# from application.properties.
# ==============================================================================

# JWT — validated >= 32 characters in JwtUtil. If JWT_SECRET is provided via env var,
# it overrides this default.
jwt.secret=${JWT_SECRET:PayrollProSaaS2026EnterpriseProductionSecureKey64CharactersLongForHMACSHA}

# H2 console must never be exposed in production.
spring.h2.console.enabled=false

# CORS allow-list from the environment. Empty default = same-origin only
# (the Docker image already serves the SPA from the same origin as the API).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# PostgreSQL Production Database (Running on EC2)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payrolldb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:payroll_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:PayrollAdminSecure2026!}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
